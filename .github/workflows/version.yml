name: Update Version

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update fxmanifest version
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          sed -i "s/^version .*/version '1.0.0-$SHORT_SHA'/" fxmanifest.lua

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fxmanifest.lua
          git diff --cached --quiet || git commit -m "chore: update resource version"
          git push